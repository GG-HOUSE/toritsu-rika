火をし、盛り上がった形の火山になりやすい。", "激しく爆発的な噴火をし、傾斜がゆるやかな形の火山になりやすい。", "穏やかな噴火をし、盛り上がった形の火山になりやすい。", "穏やかな噴火をし、傾斜がゆるやかな形の火山になりやすい。"], "answer": 0, "explain": "ねばりけが強いマグマは、激しく爆発的な噴火をし、盛り上がった形（ドーム状）の火山をつくりやすい。"}, {"kind": "choice", "field": "地学", "topic": "大地の変化", "no": 2, "q": "地震の規模（放出されるエネルギーの大きさ）を表す数値の名称として適切なのは、次のうちではどれか。", "choices": ["震度", "マグニチュード", "初期微動継続時間", "P波"], "answer": 1, "explain": "地震の規模（エネルギーの大きさ）を表すのはマグニチュード。震度は各地点でのゆれの大きさを表す。"}, {"kind": "choice", "field": "地学", "topic": "大地の変化", "no": 3, "q": "れき岩・砂岩・泥岩は、何によって区別されるか。適切なのは、次のうちではどれか。", "choices": ["岩石の色", "岩石にふくまれる粒の大きさ", "岩石ができた年代", "岩石の硬さ"], "answer": 1, "explain": "れき岩・砂岩・泥岩は、堆積物の粒の大きさ（れき＞砂＞泥）によって区別される堆積岩。"}]}, {"id": "u4", "title": "4　天気とその変化", "lead": null, "items": [{"kind": "choice", "field": "地学", "topic": "天気とその変化", "no": 1, "q": "空気1m3中に含むことのできる水蒸気量の最大値のことを何というか。適切なのは、次のうちではどれか。", "choices": ["湿度", "露点", "飽和水蒸気量", "気圧"], "answer": 2, "explain": "ある気温の空気1m3が含むことのできる水蒸気量の最大値を飽和水蒸気量という。"}, {"kind": "choice", "field": "地学", "topic": "天気とその変化", "no": 2, "q": "寒冷前線が通過するときの特徴として適切なのは、次のうちではどれか。", "choices": ["広い範囲に穏やかな雨が長時間降り、通過後は気温が上がる。", "狭い範囲に激しい雨が短時間降り、通過後は気温が下がる。", "雨は降らず、通過後に気温が大きく上がる。", "前線は動かず、同じ場所に長時間とどまる。"], "answer": 1, "explain": "寒冷前線は寒気が暖気を急激に押し上げるため、狭い範囲に激しい雨が短時間降り、通過後は気温が下がる。"}, {"kind": "write", "field": "地学", "topic": "天気とその変化", "no": 3, "q": "湿度を求める式を、「飽和水蒸気量」「空気1m3中に含まれる水蒸気量」という語句を用いて書け。", "sample": "湿度（％）＝空気1m3中に含まれる水蒸気量 ÷ その気温での飽和水蒸気量 × 100"}]}, {"id": "u5", "title": "5　身の回りの物質", "lead": null, "items": [{"kind": "choice", "field": "化学", "topic": "身の回りの物質", "no": 1, "q": "物質1cm3あたりの質量のことを何というか。適切なのは、次のうちではどれか。", "choices": ["質量", "体積", "密度", "重さ"], "answer": 2, "explain": "物質1cm3あたりの質量を密度といい、物質の種類によって決まった値をとる。"}, {"kind": "choice", "field": "化学", "topic": "身の回りの物質", "no": 2, "q": "水100gに物質20gを溶かした水溶液の質量パーセント濃度として適切なのは、次のうちではどれか（小数第1位を四捨五入せよ）。", "choices": ["15%", "17%", "20%", "25%"], "answer": 1, "explain": "質量パーセント濃度＝20÷(100+20)×100＝16.6...％→17%。"}, {"kind": "choice", "field": "化学", "topic": "身の回りの物質", "no": 3, "q": "水に溶けにくい気体を集めるのに適した方法として適切なのは、次のうちではどれか。", "choices": ["上方置換法", "下方置換法", "水上置換法", "どの方法でもよい"], "answer": 2, "explain": "水に溶けにくい気体は、水と置き換えて集める水上置換法が適している。空気より重い・軽いは関係ない。"}]}, {"id": "u6", "title": "6　化学変化と原子・分子", "lead": null, "items": [{"kind": "choice", "field": "化学", "topic": "化学変化と原子・分子", "no": 1, "q": "化学変化の前後で、物質全体の質量は変化しない。この法則の名称として適切なのは、次のうちではどれか。", "choices": ["エネルギー保存の法則", "質量保存の法則", "作用・反作用の法則", "フックの法則"], "answer": 1, "explain": "化学変化の前後で物質全体の質量が変わらないことを質量保存の法則という。"}, {"kind": "choice", "field": "化学", "topic": "化学変化と原子・分子", "no": 2, "q": "鉄と硫黄の混合物を加熱すると硫化鉄ができる。この反応を表す化学反応式として適切なのは、次のうちではどれか。", "choices": ["Fe + S → FeS", "Fe + S2 → FeS2", "2Fe + S → Fe2S", "Fe + 2S → FeS2"], "answer": 0, "explain": "鉄原子1個と硫黄原子1個が結びついて硫化鉄1個ができるので、Fe + S → FeS。"}, {"kind": "write", "field": "化学", "topic": "化学変化と原子・分子", "no": 3, "q": "酸化銅と炭素の混合物を加熱すると、酸化銅は銅になり、炭素は二酸化炭素になる。このとき酸化銅と炭素にそれぞれ起こっていることを、「酸化」「還元」という語句を用いて簡単に書け。", "sample": "酸化銅は酸素をうばわれて銅になる（還元される）。炭素は酸素と結びついて二酸化炭素になる（酸化される）。"}]}, {"id": "u7", "title": "7　光・音・力", "lead": null, "items": [{"kind": "choice", "field": "物理", "topic": "光・音・力", "no": 1, "q": "凸レンズの焦点の内側に物体を置いたときにできる像について述べたものとして適切なのは、次のうちではどれか。", "choices": ["スクリーンに実像が映る。", "物体と同じ向きの虚像が見える。", "物体と上下左右が逆の実像が見える。", "像はできない。"], "answer": 1, "explain": "焦点の内側に物体を置くと、実像はできず、物体と同じ向きの拡大された虚像が見える。"}, {"kind": "choice", "field": "物理", "topic": "光・音・力", "no": 2, "q": "ばねに加える力の大きさとばねの伸びの関係について述べたものとして適切なのは、次のうちではどれか。", "choices": ["力の大きさとばねの伸びは反比例する。", "力の大きさとばねの伸びは比例する。", "ばねの伸びは力の大きさに関係なく一定である。", "力の大きさが2倍になると、ばねの伸びは4倍になる。"], "answer": 1, "explain": "フックの法則により、ばねの伸びは加えた力の大きさに比例する。"}, {"kind": "choice", "field": "物理", "topic": "光・音・力", "no": 3, "q": "音の伝わり方について述べたものとして適切なのは、次のうちではどれか。", "choices": ["音は真空中でも伝わる。", "音は空気中より水中の方が速く伝わる。", "音は固体中では伝わらない。", "音の速さは音の高さによって変わる。"], "answer": 1, "explain": "音は空気中よりも水中、水中よりも固体中の方が速く伝わる。真空中は音を伝える物質がないため伝わらない。"}]}, {"id": "u8", "title": "8　電流とその利用", "lead": null, "items": [{"kind": "choice", "field": "物理", "topic": "電流とその利用", "no": 1, "q": "オームの法則を表す式として適切なのは、次のうちではどれか。", "choices": ["電圧＝電流×抵抗", "電圧＝電流÷抵抗", "電圧＝抵抗÷電流", "電圧＝電流＋抵抗"], "answer": 0, "explain": "オームの法則は 電圧(V)＝電流(A)×抵抗(Ω)。"}, {"kind": "choice", "field": "物理", "topic": "電流とその利用", "no": 2, "q": "電流のまわりにできる磁界の向きを調べる法則の名称として適切なのは、次のうちではどれか。", "choices": ["フレミングの法則", "右ねじの法則", "フックの法則", "オームの法則"], "answer": 1, "explain": "導線に電流を流したときにできる磁界の向きは、右ねじの法則で調べることができる。"}, {"kind": "choice", "field": "物理", "topic": "電流とその利用", "no": 3, "q": "5Ωの抵抗器に2Aの電流を流すために必要な電圧として適切なのは、次のうちではどれか。", "choices": ["2.5V", "7V", "10V", "12V"], "answer": 2, "explain": "V＝IR＝2×5＝10V。"}]}];

    html += `<label class="choice-label">
      <input type="radio" name="ans-${sec.id}-${item.no}" value="${i}">
      <span><span class="choice-mark">${MARUS[i]}</span>${c}</span>
    </label>`;
  });
  html += `<div class="result-box" id="result-${sec.id}-${item.no}"></div>`;
  html += `</div>`;
  return html;
}

function renderWriteItem(sec, item) {
  const uid = `${sec.id}-${item.no}`;
  let html = `<div class="item" data-kind="write" data-field="${item.field||''}" data-topic="${item.topic||''}" id="item-${uid}">`;
  html += `<div class="qtext"><span class="qtag">${item.topic||''}</span>〔問${item.no}〕 ${item.q}</div>`;
  html += `<textarea id="write-${uid}" placeholder="ここに答えを書いてみよう"></textarea>`;
  html += `<div><button class="reveal-btn" onclick="toggleSample('${uid}')">解答例を見る</button>
    <button class="self-btn" id="ok-${uid}" onclick="setSelf('${uid}','ok')">できた</button>
    <button class="self-btn" id="ng-${uid}" onclick="setSelf('${uid}','ng')">もう一息</button></div>`;
  html += `<div class="sample-box" id="sample-${uid}">【解答例】${item.sample}</div>`;
  html += `</div>`;
  return html;
}

function toggleSample(uid) {
  const box = document.getElementById(`sample-${uid}`);
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

const selfRatings = {};
function setSelf(uid, rating) {
  selfRatings[uid] = rating;
  document.getElementById(`ok-${uid}`).classList.toggle('active-ok', rating === 'ok');
  document.getElementById(`ng-${uid}`).classList.toggle('active-ng', rating === 'ng');
}

SECTIONS.forEach(sec => {
  let html = `<div class="section-card"><div class="section-title">${sec.title}</div>`;
  sec.items.forEach(item => { html += item.kind === 'choice' ? renderChoiceItem(sec, item) : renderWriteItem(sec, item); });
  html += `</div>`;
  root.insertAdjacentHTML('beforeend', html);
});

let lastResult = null;

function gradeAll() {
  let correct = 0, total = 0;
  const byField = {}; const weakTopics = []; const detail = [];

  SECTIONS.forEach(sec => {
    sec.items.forEach(item => {
      const uid = `${sec.id}-${item.no}`;
      const field = item.field || '未分類';
      if (!byField[field]) byField[field] = {correct:0, total:0};

      if (item.kind === 'choice') {
        total++; byField[field].total++;
        const sel = document.querySelector(`input[name="ans-${uid}"]:checked`);
        const box = document.getElementById(`result-${uid}`);
        box.style.display = 'block';
        const isCorrect = sel && parseInt(sel.value) === item.answer;
        if (isCorrect) {
          correct++; byField[field].correct++;
          box.className = 'result-box result-correct';
          box.textContent = `正解！ 【解説】${item.explain}`;
        } else {
          box.className = 'result-box result-wrong';
          const chosen = sel ? MARUS[parseInt(sel.value)] : '未回答';
          box.textContent = `不正解（あなたの回答：${chosen} / 正解：${MARUS[item.answer]}） 【解説】${item.explain}`;
          weakTopics.push(item.topic || field);
        }
        detail.push({section: sec.id, no: item.no, kind:'choice', field, topic:item.topic,
                      chosen: sel ? MARUS[parseInt(sel.value)] : null, correctAnswer: MARUS[item.answer], isCorrect: !!isCorrect});
      } else {
        const rating = selfRatings[uid] || null;
        if (rating === 'ng') weakTopics.push(item.topic || field);
        detail.push({section: sec.id, no: item.no, kind:'write', field, topic:item.topic,
                      answerText: (document.getElementById(`write-${uid}`)||{}).value || '', selfRating: rating});
      }
    });
  });

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('scoreTotal').textContent = total;

  const tbody = document.querySelector('#fieldTable tbody');
  tbody.innerHTML = '';
  Object.keys(byField).forEach(f => {
    const d = byField[f];
    const rate = d.total ? Math.round(d.correct/d.total*100) : 0;
    tbody.insertAdjacentHTML('beforeend', `<tr><td>${f}</td><td>${d.correct}</td><td>${d.total}</td><td>${rate}%</td></tr>`);
  });

  const weakList = document.getElementById('weakList');
  weakList.innerHTML = weakTopics.length ? ('苦手そうな単元：' + [...new Set(weakTopics)].map(t => `<span class="weak-tag">${t}</span>`).join('')) : '';

  document.getElementById('scoreSummary').style.display = 'block';
  document.getElementById('scoreSummary').scrollIntoView({behavior:'smooth'});
  document.getElementById('saveBtn').style.display = 'inline-block';

  lastResult = {
    examTitle: "V模擬対策 理科（中1・2範囲）",
    studentName: document.getElementById('studentName').value || null,
    date: new Date().toISOString(),
    choiceScore: {correct, total}, byField, weakTopics: [...new Set(weakTopics)], detail
  };
}

async function saveResults() {
  if (!lastResult) return;
  const filename = `V模擬理科結果_${lastResult.date.slice(0,10)}_${String(new Date().getHours()).padStart(2,'0')}${String(new Date().getMinutes()).padStart(2,'0')}.json`;
  const text = JSON.stringify(lastResult, null, 2);
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types: [{description:'JSON', accept:{'application/json':['.json']}}] });
      const writable = await handle.createWritable();
      await writable.write(text); await writable.close();
      alert('保存しました。次回はこのファイルをClaudeに見せてください。');
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
